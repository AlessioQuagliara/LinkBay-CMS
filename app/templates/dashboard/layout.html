{% extends "base.html" %}
{% block content %}
<div class="flex min-h-screen">
  <aside class="w-60 shrink-0 bg-base-100 border-r border-base-300 flex flex-col">
    <a class="flex items-center px-5 py-4 border-b border-base-300" href="{{ url_for('dashboard.overview') }}">
      <img class="h-6 w-auto" src="{{ url_for('static', filename='shared/logo.png') }}" alt="LinkBayCMS">
    </a>
    <ul class="menu p-3 gap-1 flex-1">

      <li>
        <a class="{{ 'menu-active' if request.endpoint == 'dashboard.overview' }}" href="{{ url_for('dashboard.overview') }}">
          <span class="iconify size-4" data-icon="lucide:panels-top-left"></span> 
          Overview
        </a>
      </li>

      <li>
        <a class="{{ 'menu-active' if request.endpoint == 'dashboard.insights' }}" href="{{ url_for('dashboard.insights') }}">
          <span class="iconify size-4" data-icon="lucide:trending-down"></span>
          Insights
        </a>
      </li>

      <li>
        <a class="{{ 'menu-active' if request.endpoint == 'dashboard.connect' }}" href="{{ url_for('dashboard.connect') }}">
          <span class="iconify size-4" data-icon="lucide:cable"></span>
          Connector
        </a>
      </li>

      {% if current_user.is_admin %}
        <li><a href="{{ url_for('admin.index') }}">Flask-Admin</a></li>
      {% endif %}
    </ul>
    <div class="px-5 py-4 border-t border-base-300 text-sm text-base-content/70">
      {{ current_user.name }}<br>
      <a class="link link-hover" href="{{ url_for('auth.logout') }}">Logout</a>
    </div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="h-14 shrink-0 bg-base-100 border-b border-base-300 flex items-center justify-end px-6">
      <span class="text-sm text-base-content/60">{{ current_user.email }}</span>
    </header>
    <main class="p-6 max-w-6xl w-full">
      {% block dashboard_content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
