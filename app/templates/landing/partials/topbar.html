<div class="bg-base-200 border-base-300 border-b px-1 py-1.5 text-center text-[11px] sm:text-sm">
    <span>
        <span class="text-error font-medium">Update:</span>
        TailwindCSS 4 & DaisyUI 5 revamp your control!
    </span>
</div>

<div
    id="layout-topbar"
    class="bg-base-100 lg:bg-base-100/90 border-base-300 sticky top-0 z-10 border-b data-[at-top=true]:border-transparent lg:backdrop-blur-sm">
    <div class="container">
        <nav class="flex items-center justify-between py-2">
            <div class="flex items-center gap-2">
                <label
                    for="menu-drawer"
                    id="menu-drawer-trigger"
                    aria-label="open sidebar"
                    class="btn btn-square btn-ghost btn-sm lg:hidden">
                    <span class="iconify lucide--menu size-5"></span>
                </label>

                <!-- Navbar Brand logo -->
                <a href="{{ url_for('main.index') }}">
                    <img src="{{ url_for('static', filename='shared/logo.png') }}" alt="LinkBayCMS" class="h-7 w-auto" />
                </a>
            </div>

            <div class="max-lg:hidden">
                <ul class="menu menu-horizontal gap-2 px-1">
                    <li class="font-medium"><a href="#home">Home</a></li>
                    <li class="font-medium"><a href="#features">Features</a></li>
                    <li class="font-medium"><a href="#integrations">Integrations</a></li>
                    <li class="font-medium"><a href="#pricing">Pricing</a></li>
                    <li class="font-medium"><a href="#faq">FAQ</a></li>
                </ul>
            </div>

            <div class="space-x-2">
                {% if current_user.is_authenticated %}
                    <a class="btn btn-ghost btn-sm" href="{{ url_for('auth.logout') }}">Exit</a>
                    <a class="btn btn-error text-white btn-sm" href="{{ url_for('dashboard.overview') }}">Dashboard</a>
                {% else %}
                    <a class="btn btn-ghost btn-sm" href="{{ url_for('auth.register') }}">Sign Up</a>
                    <a class="btn btn-error text-white btn-sm" href="{{ url_for('auth.login') }}">Sign In</a>
                {% endif %}
            </div>
        </nav>

        <!-- sm screen menu (drawer) -->
        <div class="drawer">
            <input id="menu-drawer" type="checkbox" class="drawer-toggle" />
            <div class="drawer-side">
                <label for="menu-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
                <div class="bg-base-100 min-h-full w-60 p-5">
                    <a href="{{ url_for('main.index') }}">
                        <img src="{{ url_for('static', filename='shared/logo.png') }}" alt="LinkBayCMS" class="h-6 w-auto" />
                    </a>
                    <ul class="menu w-full gap-2 p-0 pt-4">
                        <li class="font-medium"><a href="#home">Home</a></li>
                        <li class="font-medium"><a href="#features">Features</a></li>
                        <li class="font-medium"><a href="#integrations">Integrations</a></li>
                        <li class="font-medium"><a href="#pricing">Pricing</a></li>
                        <li class="font-medium"><a href="#faq">FAQ</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
