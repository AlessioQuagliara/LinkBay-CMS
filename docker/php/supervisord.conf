[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker.log
stopwaitsecs=3600

; Without this, routes/console.php's Schedule::* entries (billing reprocess,
; entitlement expiry, agency health alerts, low-stock checks, AI credit bonus,
; Stripe Connect onboarding sync) are registered but never fire — nothing in
; this stack ever calls schedule:run. schedule:work loops it every minute
; in the foreground, same as a cron entry would, without needing host cron.
[program:laravel-scheduler]
command=php /var/www/artisan schedule:work
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
