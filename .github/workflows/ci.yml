name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which areas changed ─────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            # frontend/ is the single storefront + marketing codebase (see
            # frontend/README.md). _archive/** is intentionally excluded —
            # it's archived reference code, not part of the build.
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ── Backend: Laravel / PHPUnit ─────────────────────────────────────────────
  # Tests use SQLite :memory: (see backend/phpunit.xml) — no Postgres or Redis needed.
  backend-tests:
    name: Backend Tests (PHP 8.4)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring, dom, fileinfo, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # AgencyPanelProvider registers a Vite theme (resources/css/filament-agency.css).
      # Filament resolves that manifest synchronously the moment it actually renders
      # any page for that panel — tests that reach a real panel render (not just an
      # early 404 from EnsureValidAgencyDomain) throw ViteManifestNotFoundException
      # without a built public/build/manifest.json. backend-assets (below) builds the
      # same assets but is a fully independent parallel job with no artifact sharing,
      # so this job needs its own build rather than depending on that one.
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      # Migrations without an explicit $connection (e.g. create_tenants_table) land on
      # the "default" connection; migrations under database/migrations/central force the
      # 'central' connection explicitly. --database=central makes both resolve to the
      # same in-memory SQLite instance — see tests/CentralTestCase for the same pattern.
      - name: Validate migrations (SQLite in-memory sanity check)
        run: php artisan migrate --force --database=central
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CENTRAL_DB_DRIVER: sqlite
          CENTRAL_DB_DATABASE: ':memory:'
          STRIPE_SECRET: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          TERMS_VERSION: test-v1

      # No --parallel: brianium/paratest is not a project dependency, so
      # `php artisan test --parallel` fails outright before running a single
      # test. The suite runs in ~6s sequentially, which doesn't justify
      # adding a new dev dependency just to parallelize it.
      - name: Run PHPUnit tests
        run: php artisan test

  # ── Backend: Vite / Filament assets ────────────────────────────────────────
  backend-assets:
    name: Backend Assets (Vite)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # resources/css/filament-agency.css imports Filament's own CSS straight out of
      # vendor/ (@import '../../vendor/filament/filament/resources/css/index.css'),
      # so Vite can't build without the Composer dependencies present first.
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

  # ── Frontend: Next.js marketing site ───────────────────────────────────────
  frontend-build:
    name: Frontend Build (Next.js 16)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Correct var name is NEXT_PUBLIC_API_BASE_URL (this previously said
          # NEXT_PUBLIC_API_URL, which the app never reads — silently a no-op).
          # Must contain {slug} and point at STORE_DOMAIN, not a central host —
          # see frontend/.env.example.
          NEXT_PUBLIC_API_BASE_URL: https://{slug}.yoursite-linkbay-cms.com
