# =============================================================================
# compose.override.local.yml — LOCALE / DEV (Mac con /etc/hosts .test)
# =============================================================================
# Comando locale:
#   docker compose -f compose.yaml -f compose.override.local.yml up -d
#
# Oppure symlink per carico automatico:
#   ln -sf compose.override.local.yml docker-compose.override.yml
#   docker compose up -d
#
# Cosa fa questo file:
#   - sovrascrive i default di produzione con valori .test
#   - aggiunge i router Traefik per i domini .test locali
#   - espone le porte DB/Redis sull'host per strumenti GUI
#   - aggiunge debug/log verbose
#   - ha il Stripe CLI sidecar commentato (decommentare se serve)
#
# Domini locali supportati (richiedono /etc/hosts o dnsmasq):
#
#   --- Laravel centrale: agency dashboard, superadmin, registrazione (CENTRAL_DOMAIN) ---
#   127.0.0.1  linkbay-cms.test
#   127.0.0.1  app.linkbay-cms.test
#   127.0.0.1  admin.linkbay-cms.test
#   127.0.0.1  api.linkbay-cms.test
#
#   --- Storefront Next.js del tenant: shop/cart/checkout/account (CENTRAL_DOMAIN,
#       stesso dominio dei tre host sopra ma QUALSIASI altro subdomain — vedi
#       frontend-test-wildcard più sotto) ---
#   Aggiungere una riga per ogni store creato, es:
#   127.0.0.1  clientalpha.linkbay-cms.test
#
#   --- Backend Laravel del tenant: pannello Filament /admin + api/store/* +
#       api/v1/* (STORE_DOMAIN — dominio DIVERSO da quello sopra, anche se lo
#       slug è lo stesso) ---
#   127.0.0.1  clientalpha.yoursite-linkbay-cms.test
#
# Nota: uno store "clientalpha" usa entrambi gli host, per due scopi diversi —
# non sono intercambiabili (vedi TenantProvisioningService::registerDomain,
# che registra solo il secondo come dominio tenant lato Laravel).
#
# Protocollo: HTTP puro (porta 80). Nessun TLS locale.
# =============================================================================

services:

  php:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_LOG_LEVEL: debug
      APP_URL: http://app.linkbay-cms.test
      FRONTEND_URL: http://linkbay-cms.test
      CENTRAL_DOMAIN: linkbay-cms.test
      # Dominio dei tenant/store cliente — separato da CENTRAL_DOMAIN
      STORE_DOMAIN: yoursite-linkbay-cms.test
      SESSION_DOMAIN: .linkbay-cms.test
      SANCTUM_STATEFUL_DOMAINS: "linkbay-cms.test,app.linkbay-cms.test,admin.linkbay-cms.test,testagency.linkbay-cms.test,clientalpha.linkbay-cms.test"
      # Incolla qui il whsec_... da `stripe listen` (si aggiorna ad ogni riavvio del CLI)
      # STRIPE_WEBHOOK_SECRET: whsec_INCOLLA_OUTPUT_STRIPE_LISTEN

  frontend:
    environment:
      # {slug} viene sostituito a runtime con il tenant slug risolto dal middleware —
      # il backend risolve il tenant dal dominio della richiesta (STORE_DOMAIN), un
      # dominio centrale/condiviso qui viene rifiutato da PreventAccessFromCentralDomains.
      NEXT_PUBLIC_API_BASE_URL: http://{slug}.yoursite-linkbay-cms.test
    labels:
      # Override: aggiungi i router .test per il frontend locale
      - "traefik.enable=true"
      - "traefik.http.services.frontend-svc.loadbalancer.server.port=3000"
      # linkbay-cms.test → Next.js (landing)
      - "traefik.http.routers.frontend-test.rule=Host(`linkbay-cms.test`) || Host(`www.linkbay-cms.test`)"
      - "traefik.http.routers.frontend-test.entrypoints=web"
      - "traefik.http.routers.frontend-test.service=frontend-svc"
      # Storefront tenant di un negozio: {slug}.linkbay-cms.test → Next.js, che fa
      # da lì il rewrite verso /storefront (middleware.ts + NEXT_PUBLIC_MAIN_DOMAIN,
      # da impostare a linkbay-cms.test in .env.local — vedi .env.local.example).
      # Priorità più bassa di test-wildcard qui sotto: per app./admin./api.test
      # vince sempre nginx/Laravel, per qualsiasi altro subdomain vince questo.
      - "traefik.http.routers.frontend-test-wildcard.rule=HostRegexp(`[a-z0-9-]+\\.linkbay-cms\\.test`)"
      - "traefik.http.routers.frontend-test-wildcard.entrypoints=web"
      - "traefik.http.routers.frontend-test-wildcard.service=frontend-svc"
      - "traefik.http.routers.frontend-test-wildcard.priority=1"
      # Fallback localhost → Next.js
      - "traefik.http.routers.frontend-local.rule=Host(`localhost`) || Host(`www.localhost`)"
      - "traefik.http.routers.frontend-local.entrypoints=web"
      - "traefik.http.routers.frontend-local.service=frontend-svc"

  nginx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.nginx-svc.loadbalancer.server.port=80"
      # Solo gli host centrali Laravel (agency panel, app, admin) — NON un
      # wildcard *.linkbay-cms.test generico: la storefront di un tenant vive
      # sullo stesso dominio padre (frontend-test-wildcard sopra) e deve
      # arrivare al container Next.js, non a Laravel (che non ha viste
      # storefront proprie). Priorità esplicita più alta così questi 3 host
      # vincono sempre sul wildcard frontend. Vedi config/tenancy.php
      # central_domains per la lista lato Laravel.
      - "traefik.http.routers.test-wildcard.rule=Host(`app.linkbay-cms.test`) || Host(`admin.linkbay-cms.test`) || Host(`api.linkbay-cms.test`)"
      - "traefik.http.routers.test-wildcard.entrypoints=web"
      - "traefik.http.routers.test-wildcard.service=nginx-svc"
      - "traefik.http.routers.test-wildcard.priority=100"
      # *.yoursite-linkbay-cms.test → nginx → Laravel (tenant/store cliente)
      - "traefik.http.routers.test-store-wildcard.rule=HostRegexp(`[a-z0-9-]+\\.yoursite-linkbay-cms\\.test`)"
      - "traefik.http.routers.test-store-wildcard.entrypoints=web"
      - "traefik.http.routers.test-store-wildcard.service=nginx-svc"
      # Fallback localhost → nginx (per curl diretti, Stripe CLI interno, ecc.)
      - "traefik.http.routers.localhost-nginx.rule=HostRegexp(`[a-z0-9-]+\\.localhost`)"
      - "traefik.http.routers.localhost-nginx.entrypoints=web"
      - "traefik.http.routers.localhost-nginx.service=nginx-svc"

  db:
    # Espone Postgres sull'host per Postico / DBeaver / psql
    ports:
      - "5432:5432"

  redis:
    # Espone Redis sull'host per RedisInsight / redis-cli
    ports:
      - "6379:6379"

  # ── Stripe CLI (sidecar opzionale) ───────────────────────────────────────────
  # Decommentare per forwarding automatico eventi Stripe test al webhook locale.
  # Richiede APP_STRIPE_SECRET_KEY nel root .env.
  # Alternativa: eseguire manualmente `stripe listen` nel terminale.
  #
  # stripe-cli:
  #   image: stripe/stripe-cli:latest
  #   container_name: saas_stripe_cli
  #   command: >
  #     listen
  #     --api-key ${APP_STRIPE_SECRET_KEY}
  #     --forward-to http://nginx/api/stripe/webhook
  #     --skip-verify
  #   networks:
  #     - web
  #   depends_on:
  #     - nginx
  #   restart: unless-stopped
