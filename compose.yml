services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkbay
      POSTGRES_PASSWORD: linkbay
      POSTGRES_DB: linkbay_cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Opzionale: l'app dentro Docker. Per lo sviluppo quotidiano è più comodo
  # avviare solo `db` qui e lanciare `python run.py` in locale (vedi README).
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linkbay:linkbay@db:5432/linkbay_cms
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  # Job ricorrenti (vedi ./crontab). In dev serve soprattutto per test manuali
  # una tantum: `docker compose run --rm cron flask <comando>`.
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linkbay:linkbay@db:5432/linkbay_cms
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: ["supercronic", "/app/crontab"]

  # Broker per la coda RQ (app/jobs/) — scan GSC on-demand e run AI Analyzer
  # eseguiti in background invece che dentro la request. Vedi app/jobs/queue.py.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Consuma le code RQ in ordine di priorità (high > default > low, vedi
  # PlanLimits.queue_priority). Stessa immagine di "web"/"cron", cambia solo
  # il comando. In dev: `docker compose run --rm worker rq worker --burst
  # high default low` per processare i job in coda una tantum senza tenere
  # il worker sempre acceso.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linkbay:linkbay@db:5432/linkbay_cms
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: ["rq", "worker", "high", "default", "low", "--url", "redis://redis:6379/0"]

volumes:
  pgdata:
  redisdata:
