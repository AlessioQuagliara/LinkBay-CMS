# =============================================================================
# compose.prod.yaml — PRODUCTION HARDENING OVERLAY
# =============================================================================
# Usage:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# compose.yaml alone is a working plain-HTTP stack with Traefik's dashboard
# exposed insecurely on :8080 — fine for a first boot/smoke test, not for the
# public internet. This overlay is what actually made that safe once, by hand,
# during the first production incident (dashboard disabled, port 8080 closed):
# this file makes that permanent and version-controlled, and adds real HTTPS.
#
# Requires, once, before first use:
#   mkdir -p traefik && touch traefik/acme.json && chmod 600 traefik/acme.json
# (Traefik refuses to start ACME storage with looser permissions than 600.)
#
# Requires in your root .env: ACME_EMAIL=you@yourdomain.com (see .env.example)
#
# ── What this does NOT cover ────────────────────────────────────────────────
# `--certificatesresolvers.le.acme.tlschallenge=true` (TLS-ALPN-01) can only
# issue certificates for hosts it can resolve one at a time — it does NOT
# support wildcards. Two routers below are genuine wildcards
# (prod-store-wildcard: *.STORE_DOMAIN, frontend-wildcard: *.CENTRAL_DOMAIN —
# every tenant's admin panel and storefront) and are deliberately left on
# plain HTTP here. Getting those onto HTTPS needs a DNS-01 challenge via
# whichever DNS provider you use (a Traefik DNS challenge plugin + API token) —
# out of scope for this file; add it when you're ready, this isn't a blocker
# for the fixed hosts (app./admin./api./bare central domain) to be secure now.
# =============================================================================

services:

  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Plain HTTP everywhere redirects to HTTPS — covers the wildcard hosts
      # too (they just won't have a valid cert yet; browsers will warn until
      # DNS-01 is set up, but nothing is silently served over cleartext).
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/acme.json"
      # No --api.insecure, no dashboard, no :8080 — this is the actual fix.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json

  # Docker Compose replaces (never merges) list-type keys like `labels` across
  # files, so the full label set from compose.yaml is repeated here with the
  # TLS additions — not just the diff — or the base routing rules would be
  # lost entirely when this overlay is applied.
  nginx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.nginx-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.prod-central.rule=Host(`app.${CENTRAL_DOMAIN:-linkbay-cms.com}`) || Host(`admin.${CENTRAL_DOMAIN:-linkbay-cms.com}`) || Host(`api.${CENTRAL_DOMAIN:-linkbay-cms.com}`)"
      - "traefik.http.routers.prod-central.entrypoints=web,websecure"
      - "traefik.http.routers.prod-central.tls.certresolver=le"
      - "traefik.http.routers.prod-central.service=nginx-svc"
      - "traefik.http.routers.prod-central.priority=100"
      # Wildcard — stays HTTP-only, see header comment.
      - "traefik.http.routers.prod-store-wildcard.rule=HostRegexp(`.+\\.${STORE_DOMAIN:-yoursite-linkbay-cms.com}`)"
      - "traefik.http.routers.prod-store-wildcard.entrypoints=web"
      - "traefik.http.routers.prod-store-wildcard.service=nginx-svc"

  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.frontend-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend-prod.rule=Host(`${CENTRAL_DOMAIN:-linkbay-cms.com}`) || Host(`www.${CENTRAL_DOMAIN:-linkbay-cms.com}`)"
      - "traefik.http.routers.frontend-prod.entrypoints=web,websecure"
      - "traefik.http.routers.frontend-prod.tls.certresolver=le"
      - "traefik.http.routers.frontend-prod.service=frontend-svc"
      # Wildcard — stays HTTP-only, see header comment.
      - "traefik.http.routers.frontend-wildcard.rule=HostRegexp(`.+\\.${CENTRAL_DOMAIN:-linkbay-cms.com}`)"
      - "traefik.http.routers.frontend-wildcard.entrypoints=web"
      - "traefik.http.routers.frontend-wildcard.service=frontend-svc"
      - "traefik.http.routers.frontend-wildcard.priority=1"
