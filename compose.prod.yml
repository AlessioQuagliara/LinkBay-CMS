services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.email=quagliara.alessio@gmail.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # Resolver aggiuntivo via HTTP-challenge, per domini non gestiti su
      # Cloudflare (es. fightclub.yoursite-linkbay-cms.com, DNS GoDaddy).
      - --certificatesresolvers.le-http.acme.httpchallenge=true
      - --certificatesresolvers.le-http.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le-http.acme.email=quagliara.alessio@gmail.com
      - --certificatesresolvers.le-http.acme.storage=/letsencrypt/acme-http.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkbay
      # Da .env, mai nel repo. Nessuna porta pubblicata: l'app raggiunge il DB
      # sulla rete Docker interna (db:5432); per psql usa
      # `docker compose -f compose.prod.yml exec db psql -U linkbay linkbay_cms`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mancante in .env}
      POSTGRES_DB: linkbay_cms
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linkbay:${POSTGRES_PASSWORD}@db:5432/linkbay_cms
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.linkbay.loadbalancer.server.port=3000"
      # www.linkbay-cms.com -> app
      - "traefik.http.routers.linkbay.rule=Host(`www.linkbay-cms.com`)"
      - "traefik.http.routers.linkbay.entrypoints=websecure"
      - "traefik.http.routers.linkbay.tls.certresolver=le"
      - "traefik.http.routers.linkbay.service=linkbay"
      # linkbay-cms.com -> redirect 301 su www.linkbay-cms.com
      - "traefik.http.routers.linkbay-apex.rule=Host(`linkbay-cms.com`)"
      - "traefik.http.routers.linkbay-apex.entrypoints=websecure"
      - "traefik.http.routers.linkbay-apex.tls.certresolver=le"
      - "traefik.http.routers.linkbay-apex.tls.domains[0].main=linkbay-cms.com"
      - "traefik.http.routers.linkbay-apex.tls.domains[0].sans=*.linkbay-cms.com"
      - "traefik.http.routers.linkbay-apex.service=linkbay"
      - "traefik.http.routers.linkbay-apex.middlewares=redirect-to-www"
      - "traefik.http.middlewares.redirect-to-www.redirectregex.regex=^https://linkbay-cms\\.com/(.*)"
      - "traefik.http.middlewares.redirect-to-www.redirectregex.replacement=https://www.linkbay-cms.com/$${1}"
      - "traefik.http.middlewares.redirect-to-www.redirectregex.permanent=true"

  # Job ricorrenti (storico, digest email, recovery check — vedi ./crontab).
  # Stessa immagine di "web", ma esegue supercronic invece di gunicorn: nessun
  # servizio esterno o crontab di sistema da configurare a mano sul server.
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linkbay:${POSTGRES_PASSWORD}@db:5432/linkbay_cms
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: ["supercronic", "/app/crontab"]

  # Broker per la coda RQ (app/jobs/) — scan GSC on-demand e run AI Analyzer
  # eseguiti in background invece che dentro la request. Vedi app/jobs/queue.py.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  # Consuma le code RQ in ordine di priorità (high > default > low, vedi
  # PlanLimits.queue_priority). Stessa immagine di "web"/"cron".
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linkbay:${POSTGRES_PASSWORD}@db:5432/linkbay_cms
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: ["rq", "worker", "high", "default", "low", "--url", "redis://redis:6379/0"]

volumes:
  pgdata:
  traefik-certs:
  redisdata:
